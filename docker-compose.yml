# ──────────────────────────────────────────────────────────
# BlockERP — Docker Compose (Production)
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d
# ──────────────────────────────────────────────────────────

services:
  # ── MongoDB ──────────────────────────────────────────────
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-blockerp}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blockerp-net

  # ── BlockERP API + Frontend ─────────────────────────────
  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://${MONGO_USER:-blockerp}:${MONGO_PASSWORD}@mongo:27017/blockerp?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
    networks:
      - blockerp-net

volumes:
  mongo-data:

networks:
  blockerp-net:
    driver: bridge
